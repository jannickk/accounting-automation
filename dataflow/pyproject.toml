[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accounts_payable_automation"
version = "0.1.0"
description = "Dataflow package to auomate reliable OCR on incoing invoices using Mistral AI"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Accounting Automation" }
]
keywords = ["accounts-payable", "dataverse", "mistral-ai", "dataflow", "automation"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent"
]

dependencies = [
  "fastapi",
  "uvicorn",
  "google-cloud-bigquery",
  "google-cloud-storage",
  "google-auth",
  "aiohttp",
  "google-cloud-documentai",
  "pydantic",
  "pydantic-settings",
  "PowerPlatform-Dataverse-Client",
  "azure-identity",
  "sqlmodel"
]

[project.optional-dependencies]
tests = [
  "pytest",
  "pytest-asyncio"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = [
        "src"
        ]
include = ["*"]
